name: test

on:
  push:
  pull_request:

jobs:
  homebrew:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Register tap
        run: brew tap EasonAI-5589/tap "$GITHUB_WORKSPACE"
      - name: Validate formulae
        run: |
          brew style Formula/aihc-dashboard.rb Formula/alipai-dashboard.rb
          brew audit --strict EasonAI-5589/tap/aihc-dashboard EasonAI-5589/tap/alipai-dashboard
      - name: Install and test AIHC dashboard
        run: |
          brew install EasonAI-5589/tap/aihc-dashboard
          brew test aihc-dashboard
      - name: Install and test AliPAI dashboard
        run: |
          brew install EasonAI-5589/tap/alipai-dashboard
          brew test alipai-dashboard
